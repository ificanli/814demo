<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>莓风群岛 - 堆叠大陆版RTS</title>
  <link rel="stylesheet" href="fun.css">
</head>

  <aside class="right">
    <h2>发现日志</h2>
    <ol id="log"></ol>
    <h2>已知配方</h2>
    <div id="recipes" class="recipes"></div>

  <script src="fun.js"></script>
